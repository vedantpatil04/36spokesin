# Optional local PostgreSQL for development. The API itself runs with `npm run start:dev`.
#   docker compose -f backend/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spokes
      POSTGRES_PASSWORD: spokes
      POSTGRES_DB: spokes_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spokes -d spokes_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
